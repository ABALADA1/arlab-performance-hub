name: Diagnose V683 scripts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download V683 and check scripts
        shell: bash
        run: |
          set -u
          ROOT="https://xnlkjkrkkehplsbbziil.supabase.co/storage/v1/object/public/arlab-v683-static/"
          curl -fsSL "${ROOT}index.html?v=$(date +%s)" -o index.html
          echo "=== SCRIPT SOURCES ==="
          python3 - <<'PY' > scripts.txt
          import re
          s=open('index.html',encoding='utf-8',errors='replace').read()
          for x in re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',s,re.I):
              print(x)
          PY
          cat scripts.txt
          echo "=== SYNTAX CHECK ==="
          failures=0
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            case "$src" in
              http://*|https://*) url="$src" ;;
              /*) url="https://xnlkjkrkkehplsbbziil.supabase.co$src" ;;
              *) url="${ROOT}${src}" ;;
            esac
            file="/tmp/$(echo "$src" | sed 's/[?&#].*$//' | sed 's#[^A-Za-z0-9._-]#_#g')"
            echo "CHECK $src"
            if ! curl -fsSL "$url" -o "$file"; then
              echo "DOWNLOAD_FAIL $src"
              failures=$((failures+1))
              continue
            fi
            if ! node --check "$file" >/tmp/check.out 2>&1; then
              echo "SYNTAX_FAIL $src"
              cat /tmp/check.out
              failures=$((failures+1))
            else
              echo "OK $src"
            fi
          done < scripts.txt
          echo "FAILURES=$failures"
          test "$failures" -eq 0

name: Deploy ARLAB Backblaze Free

on:
  workflow_dispatch:
  push:
    branches: [backblaze-free-migration]
    paths:
      - 'backblaze-free/**'
      - '.github/workflows/backblaze-free-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backblaze-free
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          missing=0
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID B2_KEY_ID B2_APPLICATION_KEY B2_ENDPOINT B2_BUCKET; do
            if [ -z "${!n}" ]; then echo "Missing required secret: $n"; missing=1; fi
          done
          exit $missing
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Upload Backblaze secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const names=['B2_KEY_ID','B2_APPLICATION_KEY','B2_ENDPOINT','B2_BUCKET','B2_REGION'];
          const out={};
          for(const n of names) if(process.env[n]) out[n]=process.env[n];
          fs.writeFileSync('/tmp/arlab-b2-secrets.json',JSON.stringify(out));
          NODE
          npx wrangler secret bulk /tmp/arlab-b2-secrets.json
          rm -f /tmp/arlab-b2-secrets.json

name: Patch Checkout V714
on:
  push:
    paths:
      - 'player-v713/checkout-v714-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch checkout to match normal app
        run: |
          python - <<'PY2'
          from pathlib import Path
          import gzip,base64,hashlib
          root=Path('player-v713')
          names=['p0','p1','r0','r1','r2','r3','r4']
          html=''.join(gzip.decompress(base64.b64decode(''.join((root/f'{n}.b64').read_text().split()))).decode('utf-8') for n in names)
          css='/* CHECK-OUT APP NORMAL V714 */\n.co714{background:#fff;border:1px solid #dce6f1;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(19,53,91,.05)}\n.co714 .v713-section{padding:18px 24px}.co714-scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}.co714-score{border:0;border-radius:5px;min-height:58px;padding:7px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:950;cursor:pointer;transition:.12s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}.co714-score:hover{transform:translateY(-1px);filter:brightness(.98)}.co714-score.sel{outline:3px solid #123d66;outline-offset:2px}.co714-score strong{font-size:16px;line-height:1}.co714-score small{font-size:7px;margin-top:5px;font-weight:900;line-height:1.05;text-align:center}.co714-c1,.co714-c2{background:#a9d8ee;color:#12324f}.co714-c3{background:#c8dd58;color:#17324f}.co714-c4{background:#e0e239;color:#17324f}.co714-c5{background:#ffd25e;color:#17324f}.co714-c6{background:#f9a33b;color:#17324f}.co714-c7{background:#f16d40;color:#fff}.co714-c8{background:#ed4b39;color:#fff}.co714-c9{background:#e51f35;color:#fff}.co714-c10{background:#d81031;color:#fff}.co714-comment textarea{min-height:92px}.co714-body-layout{display:grid;grid-template-columns:minmax(0,2.35fr) minmax(270px,1fr);gap:14px}.co714-avatars{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f4f8fd;border:1px solid #dce7f2;border-radius:14px;padding:10px}.co714-avatar-card{background:#fff;border:1px solid #dbe5ef;border-radius:12px;padding:10px;text-align:center}.co714-avatar-card>b{display:block;font-size:11px;margin-bottom:5px}.co714-map{position:relative;max-width:320px;margin:0 auto;cursor:crosshair;user-select:none}.co714-map img{display:block;width:100%;height:auto}.co714-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:#d52f43;border:3px solid #fff;box-shadow:0 2px 7px rgba(115,19,34,.45);transform:translate(-50%,-50%);pointer-events:none}.co714-dot.active{width:20px;height:20px;background:#9f1830}.co714-pill{display:inline-block;background:#15538c;color:#fff;border-radius:99px;padding:4px 8px;font-size:7px;font-weight:950;margin-top:5px}.co714-note{font-size:8px;color:#5d7893;font-weight:750;margin-top:5px}.co714-panel{background:#fff;border:1px solid #dbe5ef;border-radius:14px;padding:12px;min-height:250px}.co714-panelhead{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid #e3eaf2}.co714-panelhead b{font-size:12px}.co714-count{min-width:23px;height:23px;border-radius:99px;background:#edf4ff;color:#1767df;display:grid;place-items:center;font-size:9px;font-weight:950}.co714-empty{margin-top:10px;border:1px dashed #cad9e8;background:#f8fbfe;border-radius:11px;padding:14px;color:#71849d;font-size:10px}.co714-pain-list{display:grid;gap:7px;margin-top:10px}.co714-pain-card{border:1px solid #dfe8f1;border-radius:11px;padding:9px;background:#fbfdff}.co714-pain-card.active{border-color:#e49ca5;background:#fff8f9}.co714-pain-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.co714-pain-title{font-size:10px;font-weight:900}.co714-pain-meta{font-size:9px;color:#788da2;margin-top:2px}.co714-pain-top button{border:0;background:#fff0f2;color:#a72c3e;width:27px;height:27px;border-radius:8px;cursor:pointer;font-weight:900}.co714-sev{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}.co714-sev button{height:26px;border:1px solid #d5e0ea;background:#fff;border-radius:6px;font-size:8px;font-weight:900;cursor:pointer}.co714-sev button.sel{background:#c93a49;color:#fff;border-color:#c93a49}.co714-pain-card textarea{min-height:58px;margin-top:7px;font-size:9px}.co714-actions{padding:16px 24px;display:flex;justify-content:flex-end}.co714-actions .btn{min-width:190px}\n@media(max-width:980px){.co714-body-layout{grid-template-columns:1fr}.co714-scale{grid-template-columns:repeat(5,1fr)}}@media(max-width:680px){.co714 .v713-section{padding:16px 12px}.co714-scale{grid-template-columns:repeat(2,1fr)}.co714-avatars{grid-template-columns:1fr}.co714-actions{padding:14px 12px}.co714-actions .btn{width:100%}}\n'
          html=html.replace('</style></head>',css+'</style></head>',1)
          start=html.index('function scoreButtons(kind,val)')
          end=html.index('function reportText(v)',start)
          new='function co714Labels(){return [\'Muy muy ligero\',\'Muy ligero\',\'Ligero\',\'Algo pesado\',\'Pesado\',\'Más pesado\',\'Muy pesado\',\'Muy muy pesado\',\'Máximo\',\'Extremo\']}\nfunction scoreButtons(kind,val){var labs=co714Labels(),h=\'<div class="co714-scale">\';for(var i=1;i<=10;i++)h+=\'<button type="button" data-score="\'+kind+\'" data-v="\'+i+\'" class="co714-score co714-c\'+i+\' \'+(Number(val)===i?\'sel\':\'\')+\'"><strong>\'+i+\'</strong><small>\'+esc(labs[i-1])+\'</small></button>\';return h+\'</div>\'}\nfunction co714PainTitle(p,i){return (p.view===\'back\'?\'Punto posterior \':\'Punto anterior \')+(i+1)}\nfunction renderCo714Dots(){[\'front\',\'back\'].forEach(function(view){var box=el(\'co714Map_\'+view);if(!box)return;box.querySelectorAll(\'.co714-dot\').forEach(function(x){x.remove()});coPains.forEach(function(p,i){if((p.view||\'front\')!==view)return;var d=document.createElement(\'i\');d.className=\'co714-dot \'+(coPainActive===i?\'active\':\'\');d.style.left=(Number(p.x)||50)+\'%\';d.style.top=(Number(p.y)||50)+\'%\';box.appendChild(d)})})}\nfunction renderCo714PainPanel(){var panel=el(\'co714PainPanel\');if(!panel)return;var list=coPains||[];panel.innerHTML=\'<div class="co714-panelhead"><div><b>Puntos seleccionados</b><div class="sub" style="font-size:9px">Marca el avatar y edita aquí.</div></div><span class="co714-count">\'+list.length+\'</span></div>\'+(list.length?\'<div class="co714-pain-list">\'+list.map(function(p,i){var sev=\'\';for(var n=1;n<=10;n++)sev+=\'<button type="button" data-co714-sev="\'+i+\'" data-v="\'+n+\'" class="\'+(Number(p.severity)===n?\'sel\':\'\')+\'">\'+n+\'</button>\';return \'<div class="co714-pain-card \'+(coPainActive===i?\'active\':\'\')+\'"><div class="co714-pain-top"><div><div class="co714-pain-title">\'+esc(co714PainTitle(p,i))+\'</div><div class="co714-pain-meta">\'+(p.view===\'back\'?\'Vista posterior\':\'Vista anterior\')+\' · dolor \'+esc(p.severity||5)+\'/10</div></div><button type="button" data-co714-remove="\'+i+\'">×</button></div><div class="co714-sev">\'+sev+\'</div><textarea class="textarea" data-co714-comment="\'+i+\'" placeholder="Comentario opcional">\'+esc(p.comment||\'\')+\'</textarea></div>\'}).join(\'\')+\'</div>\':\'<div class="co714-empty">Pulsa directamente sobre el avatar. El punto se añade al instante con dolor 5/10.</div>\');renderCo714Dots()}\nfunction addCo714Point(view,x,y){coPains.push({id:\'pain_\'+Date.now()+\'_\'+Math.random().toString(36).slice(2,6),zone:\'point_\'+view+\'_\'+Date.now(),view:view,x:Math.round(x*100)/100,y:Math.round(y*100)/100,severity:5,comment:\'\',point:true});coPainActive=coPains.length-1;renderCo714PainPanel()}\nfunction renderCheckout(edit){var entry=me&&me.checkOut;if(entry&&!edit){el(\'checkoutRoot\').innerHTML=\'<div class="card wellness-card saved-box"><div class="saved-tick">✓</div><h3 style="margin:0">Check Out completado</h3><p class="sub" style="margin-top:5px">La carga percibida de hoy ya está guardada en ARLAB.</p><div class="saved-metrics" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:430px"><div class="saved-metric"><small>Campo</small><b>\'+esc(entry.fieldRpe||\'—\')+\'/10</b><span class="sub">\'+esc(rpeLabel(entry.fieldRpe))+\'</span></div><div class="saved-metric"><small>Gimnasio</small><b>\'+esc(entry.gymRpe||\'—\')+\'/10</b><span class="sub">\'+esc(rpeLabel(entry.gymRpe))+\'</span></div></div><button class="btn ghost" id="editCo" style="margin-top:15px">Editar Check Out de hoy</button></div>\';el(\'editCo\').onclick=function(){renderCheckout(true)};return}\nfieldRpe=Number(entry&&entry.fieldRpe)||0;gymRpe=Number(entry&&entry.gymRpe)||0;coPains=entry&&Array.isArray(entry.pains)?entry.pains.map(function(p){return {id:p.id||(\'pain_\'+Math.random().toString(36).slice(2)),zone:p.zone||(\'point_\'+(p.view||\'front\')+\'_\'+Math.random().toString(36).slice(2)),view:p.view||\'front\',x:p.x,y:p.y,severity:p.severity||5,comment:p.comment||\'\',point:true}}):[];coPainActive=coPains.length?0:-1;var p=model&&model.player||me&&me.user||{},first=(p.firstName||p.name||p.displayName||\'J\').charAt(0).toUpperCase();\nvar html=\'<div class="co714"><div class="v713-head"><div class="v713-head-main"><div class="v713-head-avatar">\'+esc(first)+\'</div><div><small>Check-Out · \'+esc(dstr(today))+\'</small><h3>\'+esc(p.name||p.displayName||\'Jugador\')+\'</h3><p>\'+esc(p.team||\'\')+(p.position?\' · \'+esc(p.position):\'\')+\'</p></div></div></div><div class="v713-datebar"><div><small>Fecha del registro</small><b>\'+esc(dstr(today))+\'</b></div><div><small>Fecha</small><b>\'+esc(dstr(today))+\'</b></div></div>\';\nhtml+=\'<div class="v713-section"><div class="v713-rowhead"><span class="v713-num">1</span><div><h4>¿Cómo de duro ha sido el entrenamiento de hoy en campo?</h4><p>Selecciona una puntuación del 1 al 10.</p></div></div>\'+scoreButtons(\'field\',fieldRpe)+\'</div>\';\nhtml+=\'<div class="v713-section"><div class="v713-rowhead"><span class="v713-num">2</span><div><h4>¿Cómo de duro ha sido el entrenamiento de hoy en gimnasio?</h4><p>Selecciona una puntuación del 1 al 10.</p></div></div>\'+scoreButtons(\'gym\',gymRpe)+\'</div>\';\nhtml+=\'<div class="v713-section co714-comment"><div class="v713-rowhead"><span class="v713-num">3</span><div><h4>¿Quieres comentar alguna cosa?</h4></div></div><textarea id="coComment" class="textarea" placeholder="Escríbela aquí...">\'+esc(entry&&entry.comment||\'\')+\'</textarea></div>\';\nhtml+=\'<div class="v713-section"><div class="v713-rowhead"><span class="v713-num">4</span><div><h4>Selecciona las zonas que tienes más sensibles</h4><p>Es opcional. Pulsa una zona, puntúa de 1 a 10 y añade una observación.</p></div></div><div class="co714-body-layout"><div class="co714-avatars"><div class="co714-avatar-card"><b>Vista anterior</b><div id="co714Map_front" class="co714-map" data-co714-map="front"><img draggable="false" src="\'+V713_FRONT+\'"></div><span class="co714-pill">PULSA EN EL PUNTO EXACTO</span><div class="co714-note">Pulsa en el punto exacto del avatar. Se añadirá con dolor 5/10.</div></div><div class="co714-avatar-card"><b>Vista posterior</b><div id="co714Map_back" class="co714-map" data-co714-map="back"><img draggable="false" src="\'+V713_BACK+\'"></div><span class="co714-pill">PULSA EN EL PUNTO EXACTO</span><div class="co714-note">Pulsa en el punto exacto del avatar. Se añadirá con dolor 5/10.</div></div></div><div id="co714PainPanel" class="co714-panel"></div></div></div><div id="coMsg"></div><div class="co714-actions"><button id="saveCo" class="btn primary">Guardar Check Out</button></div></div>\';\nel(\'checkoutRoot\').innerHTML=html;renderCo714PainPanel();el(\'saveCo\').onclick=saveCheckout}\nasync function saveCheckout(){if(!fieldRpe||!gymRpe){el(\'coMsg\').innerHTML=\'<div class="error" style="margin:14px 24px">Selecciona un valor del 1 al 10 para campo y gimnasio.</div>\';return}loading(true);try{var j=await callApi(\'submit_checkout\',{fieldRpe:fieldRpe,gymRpe:gymRpe,comment:el(\'coComment\').value,pains:coPains});me.checkOut=j.entry;try{model=await withTimeout(loadData(),2500,\'\')}catch(_){}renderCheckout(false);renderHome()}catch(e){el(\'coMsg\').innerHTML=\'<div class="error" style="margin:14px 24px">\'+esc(e.message)+\'</div>\'}finally{loading(false)}}\n'
          html=html[:start]+new+html[end:]
          old_click="document.addEventListener('click',function(e){var vf=e.target.closest('[data-v713-score]');"
          new_click="document.addEventListener('click',function(e){var cm=e.target.closest('[data-co714-map]');if(cm){var rr=cm.getBoundingClientRect(),cx=(e.clientX-rr.left)/rr.width*100,cy=(e.clientY-rr.top)/rr.height*100;addCo714Point(cm.getAttribute('data-co714-map'),Math.max(0,Math.min(100,cx)),Math.max(0,Math.min(100,cy)));return}var cs7=e.target.closest('[data-co714-sev]');if(cs7){var ci7=Number(cs7.getAttribute('data-co714-sev'));if(coPains[ci7]){coPains[ci7].severity=Number(cs7.getAttribute('data-v'))||5;coPainActive=ci7;renderCo714PainPanel()}return}var cr7=e.target.closest('[data-co714-remove]');if(cr7){var ri7=Number(cr7.getAttribute('data-co714-remove'));coPains.splice(ri7,1);coPainActive=coPains.length?Math.min(ri7,coPains.length-1):-1;renderCo714PainPanel();return}var vf=e.target.closest('[data-v713-score]');"
          html=html.replace(old_click,new_click,1)
          old_input="document.addEventListener('input',function(e){var vc=e.target.closest('[data-v713-comment]');"
          new_input="document.addEventListener('input',function(e){var cc7=e.target.closest('[data-co714-comment]');if(cc7){var cci=Number(cc7.getAttribute('data-co714-comment'));if(coPains[cci])coPains[cci].comment=cc7.value.slice(0,500);return}var vc=e.target.closest('[data-v713-comment]');"
          html=html.replace(old_input,new_input,1)
          assert 'CHECK-OUT APP NORMAL V714' in html and 'data-co714-map' in html
          bounds=[round(i*len(html)/7) for i in range(8)]
          for i,n in enumerate(names):
              chunk=html[bounds[i]:bounds[i+1]]
              (root/f'{n}.b64').write_text(base64.b64encode(gzip.compress(chunk.encode('utf-8'),compresslevel=9,mtime=0)).decode('ascii'))
          rebuilt=''.join(gzip.decompress(base64.b64decode((root/f'{n}.b64').read_text())).decode('utf-8') for n in names)
          assert rebuilt==html
          print('VALID_V714',len(html),hashlib.sha256(html.encode()).hexdigest())
          PY2
          git config user.name 'ARLAB Checkout Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add player-v713/p0.b64 player-v713/p1.b64 player-v713/r0.b64 player-v713/r1.b64 player-v713/r2.b64 player-v713/r3.b64 player-v713/r4.b64
          git commit -m 'Match player checkout to normal ARLAB app' || true
          git push

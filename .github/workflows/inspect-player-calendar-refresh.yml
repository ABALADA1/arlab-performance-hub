name: Inspect Player Calendar Refresh
on:
  push:
    paths:
      - 'player-v713/calendar-refresh-debug-trigger.txt'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect calendar data flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          root=Path('player-v713'); names=['p0','p1','r0','r1','r2','r3','r4']
          html=''.join(gzip.decompress(base64.b64decode(''.join((root/f'{n}.b64').read_text().split()))).decode('utf-8') for n in names)
          def fun(name,next_hint=None):
              i=html.find('function '+name)
              if i<0: i=html.find('async function '+name)
              if i<0:return 'NOT FOUND '+name
              if next_hint:
                  j=html.find(next_hint,i+10)
                  if j>i:return html[i:j]
              return html[i:i+5000]
          parts=[
            '===== loadData =====\n'+fun('loadData','function localToday'),
            '===== renderAll =====\n'+fun('renderAll','function renderHeader'),
            '===== renderCalendar =====\n'+fun('renderCalendar','function showCalEvent'),
            '===== refreshPortalData =====\n'+fun('refreshPortalData','async function enter')
          ]
          (root/'calendar-refresh-debug.txt').write_text('\n\n'.join(parts))
          print('html',len(html))
          PY
          git config user.name 'ARLAB Debug'
          git config user.email 'actions@users.noreply.github.com'
          git add player-v713/calendar-refresh-debug.txt
          git commit -m 'Inspect player calendar data mapping' || true
          git push

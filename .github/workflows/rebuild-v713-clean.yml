name: Rebuild V713 Clean
on:
  push:
    paths:
      - 'player-v713-source/rebuild-trigger.txt'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair source, rebuild and validate V713 bundles
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          p = Path('player-v713-source/src01.txt')
          s = p.read_text(encoding='utf-8').strip()
          bad = 'LVkAFLikrSo'
          good = 'LVkAFKlikrSo'
          if bad in s:
              s = s.replace(bad, good, 1)
              p.write_text(s, encoding='utf-8')
          assert len(s) == 6546, len(s)
          assert good in s

          src = ''.join(Path(f'player-v713-source/src{i:02d}.txt').read_text(encoding='utf-8').strip() for i in range(10))
          assert len(src) == 65456, len(src)
          raw = gzip.decompress(base64.b64decode(src, validate=True))
          html = raw.decode('utf-8')
          assert len(html) == 113139, len(html)
          assert len(raw) == 113331, len(raw)
          expected = 'ecd5f5c6744d75de606f3aeb19fcce3e0d88419cf40ddb9ce4eecbb3941690f9'
          assert hashlib.sha256(raw).hexdigest() == expected
          for marker in ('¿Cómo ha sido tu sueño?', '¿Cómo de estresado estás?', 'data-v713-map'):
              assert marker in html, marker
          print('VALID_SOURCE', len(html), len(raw), hashlib.sha256(raw).hexdigest())

          names = ['p0','p1','r0','r1','r2','r3','r4']
          total = len(html)
          bounds = [round(i*total/7) for i in range(8)]
          chunks = [html[bounds[i]:bounds[i+1]] for i in range(7)]
          assert ''.join(chunks) == html

          out = {}
          for name, chunk in zip(names, chunks):
              gz = gzip.compress(chunk.encode('utf-8'), compresslevel=9, mtime=0)
              b64 = base64.b64encode(gz).decode('ascii')
              back = gzip.decompress(base64.b64decode(b64, validate=True)).decode('utf-8')
              assert back == chunk
              out[name] = b64
              print('BUNDLE', name, 'chars', len(chunk), 'b64', len(b64))

          root = Path('player-v713')
          root.mkdir(exist_ok=True)
          for name in ('p0','r0','r1','r2','r3','r4'):
              (root/f'{name}.b64').write_text(out[name], encoding='utf-8')

          # Legacy production checks p1 raw length as 14860. Add only internal
          # whitespace; Node Base64 ignores it, so the decoded gzip is identical.
          p1 = out['p1']
          pad_total = 14860 - len(p1)
          mid = len(p1)//2
          compat = p1[:mid] + (' ' * pad_total) + p1[mid:]
          assert len(compat) == 14860
          assert ''.join(compat.split()) == p1
          assert gzip.decompress(base64.b64decode(compat)).decode('utf-8') == chunks[1]
          (root/'p1.b64').write_text(compat, encoding='utf-8')
          (root/'p1-repaired.b64').write_text(compat, encoding='utf-8')

          q, r = divmod(len(p1), 6)
          pos = 0
          pads = [1489, 1489, 1489, 1489, 1488, 1488]
          for i in range(6):
              n = q + (1 if i < r else 0)
              piece = p1[pos:pos+n]
              pos += n
              m = len(piece)//2
              wrapped = piece[:m] + (' ' * pads[i]) + piece[m:]
              (root/f'p1s{i}.txt').write_text(wrapped, encoding='utf-8')
          joined_p1 = ''.join((root/f'p1s{i}.txt').read_text().strip() for i in range(6))
          assert len(joined_p1) == 14860
          assert ''.join(joined_p1.split()) == p1
          print('P1_COMPAT', len(compat), len(p1))

          logical = [out['p0'], p1, out['r0'], out['r1'], out['r2'], out['r3'], out['r4']]
          reconstructed = ''.join(gzip.decompress(base64.b64decode(x, validate=True)).decode('utf-8') for x in logical)
          assert reconstructed == html
          assert len(reconstructed) == 113139
          assert hashlib.sha256(reconstructed.encode('utf-8')).hexdigest() == expected
          print('VALID_RECONSTRUCT', len(reconstructed), hashlib.sha256(reconstructed.encode('utf-8')).hexdigest())
          PY
          git config user.name 'ARLAB V713 Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add player-v713-source/src01.txt player-v713/p0.b64 player-v713/p1.b64 player-v713/p1-repaired.b64 player-v713/p1s0.txt player-v713/p1s1.txt player-v713/p1s2.txt player-v713/p1s3.txt player-v713/p1s4.txt player-v713/p1s5.txt player-v713/r0.b64 player-v713/r1.b64 player-v713/r2.b64 player-v713/r3.b64 player-v713/r4.b64
          git commit -m 'Rebuild V713 production p1 bundle' || true
          git push

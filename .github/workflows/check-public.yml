name: Check ARLAB Public URL

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check SVG endpoint
        run: |
          set -euxo pipefail
          URL="https://xnlkjkrkkehplsbbziil.supabase.co/functions/v1/arlab-v683-svg"
          curl -sSIL --max-time 20 "$URL"
          CT=$(curl -sSI --max-time 20 "$URL" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}')
          echo "CONTENT_TYPE=$CT"
          echo "$CT" | grep -q "image/svg+xml"

name: Deploy ARLAB Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ARLAB V710 static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/v710
          cp -R checkin site/checkin
          cp -R emergency site/emergency

          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          out = Path('site')
          sb = 'https://xnlkjkrkkehplsbbziil.supabase.co/storage/v1/object/public/arlab-v699-static/'
          bridge = 'https://xnlkjkrkkehplsbbziil.supabase.co/functions/v1/arlab-v699-bridge'

          def unpack(path):
              raw = Path(path).read_text(encoding='utf-8').strip()
              return gzip.decompress(base64.b64decode(raw)).decode('utf-8')

          def unpack_join(*paths):
              raw = ''.join(Path(p).read_text(encoding='utf-8').strip() for p in paths)
              return gzip.decompress(base64.b64decode(raw)).decode('utf-8')

          html = unpack('v710/chunk1.txt')
          css = unpack('v710/chunk2.txt')
          js = unpack_join('v710/chunk3a.txt', 'v710/chunk3b.txt')

          cloud = (
              f'<script src="{bridge}?release=710"></script>\n'
              '<script>window.ARLAB_CLOUD_RELEASE="V710";'
              'window.ARLAB_PLAYER_PORTAL="/arlab-performance-hub/checkin/";</script>\n'
          )
          html = html.replace('<head>', '<head>\n' + cloud, 1)

          html = re.sub(r'\s*<script[^>]+src=["\'][^"\']*arlab-v620-bundle-guard\.js[^"\']*["\'][^>]*></script>', '', html, flags=re.I)
          html = re.sub(r'\s*<script[^>]+src=["\'][^"\']*arlab-v671-refresh-memory-guard\.js[^"\']*["\'][^>]*></script>', '', html, flags=re.I)

          html = re.sub(r'\s*<link[^>]+href=["\']arlab-v70[1-9][^"\']*\.css[^"\']*["\'][^>]*>', '', html, flags=re.I)
          html = re.sub(r'\s*<script[^>]+src=["\']arlab-v70[1-9][^"\']*\.js[^"\']*["\'][^>]*></script>', '', html, flags=re.I)
          html = html.replace('</head>', '  <link rel="stylesheet" href="v710/arlab-v710.css?v=7103">\n</head>', 1)
          html = html.replace('</body>', '  <script src="v710/arlab-v710.js?v=7103" defer></script>\n</body>', 1)

          def abs_asset(m):
              attr, name, query = m.group(1), m.group(2), m.group(3) or ''
              return f'{attr}{sb}{name}{query}"'

          html = re.sub(
              r'((?:src|href)=")((?:arlab|gps|macro|micro|strength|tests|tindeq|spro|wimu)[^"?]*\.(?:js|css))(\?[^\"]*)?"',
              abs_asset,
              html,
              flags=re.I,
          )

          watchdog = '''<script>
          setTimeout(function(){
            var s=document.getElementById('arlab-fast-splash');
            if(s && !s.classList.contains('hide')){
              var t=s.querySelector('span');
              if(t)t.textContent='La aplicación tarda más de lo normal. Recarga la página si no aparece en unos segundos.';
            }
          },18000);
          </script>'''
          html = html.replace('</body>', watchdog + '\n</body>', 1)

          (out / 'index.html').write_text(html, encoding='utf-8')
          (out / 'v710' / 'arlab-v710.css').write_text(css, encoding='utf-8')
          (out / 'v710' / 'arlab-v710.js').write_text(js, encoding='utf-8')

          print('V710 preparada:', len(html), 'HTML,', len(css), 'CSS,', len(js), 'JS')
          PY

      - name: Recover deployed V773 snapshot
        shell: bash
        run: |
          set -euo pipefail
          OLD_STATIC='https://xnlkjkrkkehplsbbziil.supabase.co/storage/v1/object/public/arlab-v699-static/'
          OLD_FN='https://xnlkjkrkkehplsbbziil.supabase.co/functions/v1/'
          NEW_FN='https://wchzahvvujxxajlmxhqa.supabase.co/functions/v1/'
          OUT='site/recovered-v773'
          mkdir -p "$OUT"

          curl -fL --retry 8 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "${OLD_STATIC}index-safe.html" -o /tmp/v773-index.html

          # The safe state/player bridge is rebuilt from the deployed components,
          # but points only persistence/sync calls to the new Free recovery backend.
          curl -fL --retry 8 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "${OLD_FN}arlab-v699-state-patch?recovery=773" -o /tmp/v773-state.js
          curl -fL --retry 8 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "${OLD_FN}arlab-v699-player-sync-patch?recovery=773" -o /tmp/v773-player-sync.js
          cat /tmp/v773-state.js /tmp/v773-player-sync.js > "$OUT/arlab-v773-recovery-bridge.js"
          sed -i "s#${OLD_FN}#${NEW_FN}#g" "$OUT/arlab-v773-recovery-bridge.js"

          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import os, re, subprocess

          old = 'https://xnlkjkrkkehplsbbziil.supabase.co/storage/v1/object/public/arlab-v699-static/'
          out = Path('site/recovered-v773')
          html = Path('/tmp/v773-index.html').read_text(encoding='utf-8', errors='replace')

          # Work from the exact deployed HTML but make its static dependencies local.
          html = html.replace(old, './')
          html = re.sub(r'<base\b[^>]*>', '', html, flags=re.I)
          access = '''<script>
          (function(){
            try{
              if(!sessionStorage.getItem('arlabCloudKey')){
                var k=(window.prompt('ARLAB Cloud · Clave de acceso:')||'').trim();
                if(k)sessionStorage.setItem('arlabCloudKey',k);
              }
            }catch(e){}
          })();
          </script>\n<script src="./arlab-v773-recovery-bridge.js"></script>\n'''
          html = html.replace('<head>', '<head>\n<base href="./">\n' + access, 1)
          html = html.replace('</head>', '<meta name="arlab-recovery" content="V773-deployed-snapshot">\n</head>', 1)
          (out / 'index.html').write_text(html, encoding='utf-8')

          refs = set()
          for m in re.finditer(r'(?:src|href)\s*=\s*["\']([^"\']+)', html, flags=re.I):
              v=m.group(1).strip()
              if not v or v.startswith(('#','data:','blob:','javascript:','mailto:')): continue
              if v.startswith(('http://','https://','//')): continue
              refs.add(v)

          def clean_ref(v):
              p=urlsplit(v).path
              p=unquote(p).lstrip('./').lstrip('/')
              p=os.path.normpath(p).replace('\\','/')
              if p.startswith('../') or p in ('','.'): return None
              return p

          downloaded=set()
          def fetch_rel(rel):
              rel=clean_ref(rel)
              if not rel or rel in downloaded or rel=='arlab-v773-recovery-bridge.js': return False
              downloaded.add(rel)
              dest=out/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              url=old+rel
              r=subprocess.run(['curl','-fL','--retry','6','--retry-all-errors','--connect-timeout','12','--max-time','90',url,'-o',str(dest)],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True)
              if r.returncode!=0:
                  print('WARN missing',rel, r.stderr.strip()[-180:])
                  try: dest.unlink()
                  except: pass
                  return False
              return True

          for ref in sorted(refs): fetch_rel(ref)

          # CSS often contains icons/fonts/images not linked directly by HTML.
          for _ in range(3):
              additions=[]
              for css in list(out.rglob('*.css')):
                  txt=css.read_text(encoding='utf-8',errors='replace')
                  base=css.relative_to(out).parent
                  for m in re.finditer(r'url\(\s*["\']?([^\)"\']+)',txt,flags=re.I):
                      v=m.group(1).strip()
                      if not v or v.startswith(('data:','http://','https://','//','#')): continue
                      additions.append(str((base / urlsplit(v).path).as_posix()))
              before=len(downloaded)
              for ref in additions: fetch_rel(ref)
              if len(downloaded)==before: break

          js_count=sum(1 for _ in out.rglob('*.js'))
          css_count=sum(1 for _ in out.rglob('*.css'))
          total=sum(1 for p in out.rglob('*') if p.is_file())
          print('V773 recovered files:',total,'JS:',js_count,'CSS:',css_count)
          if js_count < 50 or css_count < 10:
              raise SystemExit(f'Recovery incomplete: JS={js_count} CSS={css_count}')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published entry points
        shell: bash
        run: |
          set -e
          sleep 8
          curl -fsSIL "${{ steps.deployment.outputs.page_url }}" | head -20
          curl -fsSIL "${{ steps.deployment.outputs.page_url }}checkin/" | head -20
          curl -fsSIL "${{ steps.deployment.outputs.page_url }}emergency/" | head -20
          curl -fsSIL "${{ steps.deployment.outputs.page_url }}recovered-v773/" | head -20

name: Deploy ARLAB Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build stable ARLAB site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/v710 site/v779
          cp -R checkin site/checkin
          cp -R emergency site/emergency
          cp -R standalone-pro-x5 site/pro-x5

          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          out = Path('site')
          sb = 'https://xnlkjkrkkehplsbbziil.supabase.co/storage/v1/object/public/arlab-v699-static/'
          bridge = 'https://xnlkjkrkkehplsbbziil.supabase.co/functions/v1/arlab-v699-bridge'

          def unpack(path):
              raw = Path(path).read_text(encoding='utf-8').strip()
              return gzip.decompress(base64.b64decode(raw)).decode('utf-8')

          def unpack_join(*paths):
              raw = ''.join(Path(p).read_text(encoding='utf-8').strip() for p in paths)
              return gzip.decompress(base64.b64decode(raw)).decode('utf-8')

          html = unpack('v710/chunk1.txt')
          css = unpack('v710/chunk2.txt')
          js = unpack_join('v710/chunk3a.txt', 'v710/chunk3b.txt')

          cloud = (
              f'<script src="{bridge}?release=710"></script>\n'
              '<script>window.ARLAB_CLOUD_RELEASE="V710";'
              'window.ARLAB_PLAYER_PORTAL="/arlab-performance-hub/checkin/";</script>\n'
          )
          html = html.replace('<head>', '<head>\n' + cloud, 1)
          html = re.sub(r'\s*<script[^>]+src=["\'][^"\']*arlab-v620-bundle-guard\.js[^"\']*["\'][^>]*></script>', '', html, flags=re.I)
          html = re.sub(r'\s*<script[^>]+src=["\'][^"\']*arlab-v671-refresh-memory-guard\.js[^"\']*["\'][^>]*></script>', '', html, flags=re.I)
          html = re.sub(r'\s*<link[^>]+href=["\']arlab-v70[1-9][^"\']*\.css[^"\']*["\'][^>]*>', '', html, flags=re.I)
          html = re.sub(r'\s*<script[^>]+src=["\']arlab-v70[1-9][^"\']*\.js[^"\']*["\'][^>]*></script>', '', html, flags=re.I)
          html = html.replace('</head>', '  <link rel="stylesheet" href="v710/arlab-v710.css?v=7103">\n</head>', 1)
          html = html.replace('</body>', '  <script src="v710/arlab-v710.js?v=7103" defer></script>\n</body>', 1)

          def abs_asset(m):
              attr, name, query = m.group(1), m.group(2), m.group(3) or ''
              return f'{attr}{sb}{name}{query}"'

          html = re.sub(
              r'((?:src|href)=")((?:arlab|gps|macro|micro|strength|tests|tindeq|spro|wimu)[^"?]*\.(?:js|css))(\?[^\"]*)?"',
              abs_asset,
              html,
              flags=re.I,
          )

          (out / 'index.html').write_text(html, encoding='utf-8')
          (out / 'v710' / 'arlab-v710.css').write_text(css, encoding='utf-8')
          (out / 'v710' / 'arlab-v710.js').write_text(js, encoding='utf-8')
          print('Stable V710 + PRO X5 prepared')
          PY

          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          import json, re, time

          STATUS = 'https://wchzahvvujxxajlmxhqa.supabase.co/functions/v1/arlab-v779-package?action=status'
          WEB = 'https://wchzahvvujxxajlmxhqa.supabase.co/functions/v1/arlab-v779-web/'
          OUT = Path('site/v779')
          PREFIX = '/arlab-performance-hub/v779/'

          def read_url(url, timeout=90):
              last = None
              for attempt in range(5):
                  try:
                      req = Request(url, headers={'User-Agent':'ARLAB-V779-Pages/1.0','Cache-Control':'no-cache'})
                      with urlopen(req, timeout=timeout) as r:
                          if r.status != 200:
                              raise RuntimeError(f'HTTP {r.status} {url}')
                          return r.read()
                  except Exception as e:
                      last = e
                      time.sleep(0.5 * (attempt + 1))
              raise last

          status = json.loads(read_url(STATUS).decode('utf-8'))
          cur = status.get('current') or {}
          webroot = str(cur.get('webRoot') or '')
          manifest = list(cur.get('manifest') or [])
          if not webroot or not manifest:
              raise RuntimeError('V779 no tiene webRoot/manifest instalado')

          rels = []
          for path in manifest:
              if path.startswith(webroot):
                  rel = path[len(webroot):]
                  if rel:
                      rels.append(rel)
          rels = sorted(set(rels))
          if 'index.html' not in rels:
              raise RuntimeError('V779 no contiene index.html en wwwroot')

          def fetch_one(rel):
              url = WEB + quote(rel, safe='/._-~()[]@+') + '?pages=7793'
              data = read_url(url, timeout=120)
              dest = OUT / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              return rel, len(data)

          total = 0
          done = 0
          with ThreadPoolExecutor(max_workers=8) as ex:
              futures = [ex.submit(fetch_one, rel) for rel in rels]
              for f in as_completed(futures):
                  rel, size = f.result()
                  total += size
                  done += 1
                  if done % 50 == 0 or done == len(rels):
                      print(f'V779: {done}/{len(rels)} archivos · {total/1024/1024:.1f} MB')

          index = OUT / 'index.html'
          html = index.read_text(encoding='utf-8')
          # Cualquier recurso raíz debe quedarse dentro de /arlab-performance-hub/v779/.
          html = re.sub(r'(\b(?:src|href)=(["\']))/(?!/)', lambda m: m.group(1) + PREFIX, html, flags=re.I)
          # Fuerza una versión nueva para el router de importación ya parcheado online.
          html = re.sub(r'arlab-v759-import-router\.js\?v=[^"\']+', 'arlab-v759-import-router.js?v=779online3', html, flags=re.I)
          html = html.replace('</head>', '<meta name="arlab-online-build" content="V779-pages-7793"></head>', 1)
          index.write_text(html, encoding='utf-8')

          if not (OUT / 'arlab-v620-app.bundle.js').exists():
              raise RuntimeError('Falta arlab-v620-app.bundle.js en V779')
          if not (OUT / 'arlab-v779-persistence-watchdog.js').exists():
              raise RuntimeError('Falta watchdog V779')
          print(f'V779 completa preparada: {len(rels)} archivos, {total/1024/1024:.1f} MB')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published routes
        shell: bash
        run: |
          set -e
          sleep 8
          BASE="${{ steps.deployment.outputs.page_url }}"
          curl -fsSIL "${BASE}v779/" | head -20
          curl -fsSIL "${BASE}v779/arlab-v620-app.bundle.js?v=7791" | head -20
          curl -fsSIL "${BASE}v779/arlab-v779-persistence-watchdog.js?v=7791" | head -20
          curl -fsSL "${BASE}v779/" | grep -q 'V779-pages-7793'
          echo 'V779 published and verified'

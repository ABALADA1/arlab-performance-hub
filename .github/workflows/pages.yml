name: Deploy ARLAB Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_URL: https://abalada1.github.io/arlab-performance-hub/v683-20260825-1924.html

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Diagnose Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "DEPLOYED_PAGE_URL=${{ steps.deployment.outputs.page_url }}"
          echo "--- PAGES CONFIG ---"
          curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true
          echo
          echo "--- PUBLIC HEADERS UNIQUE ROUTE ---"
          sleep 8
          curl -sSIL "$SITE_URL" || true

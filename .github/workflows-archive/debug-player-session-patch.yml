name: Apply Player Session Colors Participants
on:
  push:
    paths:
      - 'player-v713/session-patch-debug-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply portal patch
        run: python player-v713/patch_sessions_participants.py
      - name: Commit portal bundles
        run: |
          git config user.name 'ARLAB Player Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add player-v713/p0.b64 player-v713/p1.b64 player-v713/r0.b64 player-v713/r1.b64 player-v713/r2.b64 player-v713/r3.b64 player-v713/r4.b64
          git commit -m 'Show session colors and teammates in player portal' || true
          git push

name: Apply Player Fast Schedule
on:
  push:
    paths:
      - 'player-v713/fast-schedule-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fast schedule loading
        run: python player-v713/patch_fast_schedule.py
      - name: Commit bundles
        run: |
          git config user.name 'ARLAB Player Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add player-v713/p0.b64 player-v713/p1.b64 player-v713/r0.b64 player-v713/r1.b64 player-v713/r2.b64 player-v713/r3.b64 player-v713/r4.b64
          git commit -m 'Load player calendar and sessions first' || true
          git push

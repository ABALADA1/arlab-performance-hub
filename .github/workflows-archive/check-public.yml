name: Check ARLAB Public URL

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check jsDelivr loader
        run: |
          set -euxo pipefail
          URL="https://cdn.jsdelivr.net/gh/ABALADA1/arlab-performance-hub@gh-pages/v683-20260825-1924.html"
          curl -sSIL --max-time 20 "$URL"
          CT=$(curl -sSI --max-time 20 "$URL" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}')
          echo "CONTENT_TYPE=$CT"
          echo "$CT" | grep -q "text/html"
          curl -fsSL --max-time 20 "$URL" | head -c 80

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d5bd7">
<title>ARLAB V710 Cloud</title>
<style>
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#17324f}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#f4f7fb;z-index:999999}.card{background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:28px 32px;box-shadow:0 12px 36px rgba(18,54,93,.09);text-align:center;min-width:300px;max-width:min(680px,calc(100vw - 28px))}.mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#4f8cff,#0d5bd7);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-size:30px;font-weight:900}.card b{display:block;font-size:18px;margin-bottom:8px}.card span{font-size:12px;color:#718197;line-height:1.5}.bar{width:190px;height:5px;border-radius:99px;background:#dce6f3;overflow:hidden;margin:16px auto 0}.bar i{display:block;width:45%;height:100%;background:#0d5bd7;animation:load .8s ease-in-out infinite alternate}@keyframes load{from{transform:translateX(-30%)}to{transform:translateX(160%)}}.err{color:#c43f46!important;white-space:pre-wrap}.retry{display:none;margin:16px auto 0;border:0;border-radius:10px;background:#0d6efd;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div id="boot"><div class="card"><div class="mark">A</div><b>Abriendo ARLAB V710</b><span id="msg">Preparando la última versión…</span><div class="bar" id="bar"><i></i></div><button class="retry" id="retry" onclick="location.reload()">Reintentar</button></div></div>
<script>
(async()=>{'use strict';
const ROOT='https://xnlkjkrkkehplsbbziil.supabase.co/storage/v1/object/public/arlab-v699-static/';
const BRIDGE='https://xnlkjkrkkehplsbbziil.supabase.co/functions/v1/arlab-v699-bridge';
const msg=document.getElementById('msg'),retry=document.getElementById('retry'),bar=document.getElementById('bar');
const stamp=Date.now();
const fail=e=>{console.error('[ARLAB V710 loader]',e);msg.className='err';msg.textContent='No se ha podido abrir ARLAB V710.\n'+String(e&&e.message?e.message:e);bar.style.display='none';retry.style.display='block'};
const timed=async(url,ms=18000)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error(url+' · HTTP '+r.status);return await r.text()}finally{clearTimeout(t)}};
async function gunzipB64(s){
  if(!('DecompressionStream' in window))throw new Error('Este navegador no permite descomprimir la versión cloud. Actualiza Chrome/Safari y vuelve a abrir.');
  const clean=String(s||'').trim();
  const bin=Uint8Array.from(atob(clean),c=>c.charCodeAt(0));
  const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
try{
  msg.textContent='Cargando componentes V710…';
  const [h64,c64,j1,j2,bridge]=await Promise.all([
    timed('./v710/chunk1.txt?v='+stamp),timed('./v710/chunk2.txt?v='+stamp),
    timed('./v710/chunk3a.txt?v='+stamp),timed('./v710/chunk3b.txt?v='+stamp),
    timed(BRIDGE+'?v='+stamp)
  ]);
  msg.textContent='Montando aplicación…';
  const [source,css,js]=await Promise.all([gunzipB64(h64),gunzipB64(c64),gunzipB64(j1+j2)]);
  const parsed=new DOMParser().parseFromString(source,'text/html');
  if(!parsed.documentElement||!parsed.head||!parsed.body)throw new Error('La plantilla V710 no es válida.');

  const oldBase=parsed.querySelector('base');
  if(oldBase) oldBase.href=ROOT; else {const b=parsed.createElement('base');b.href=ROOT;parsed.head.prepend(b)}

  [...parsed.querySelectorAll('script[src]')].forEach(s=>{
    const src=s.getAttribute('src')||'';
    if(src.includes('action=bridge')||src.includes('arlab-v699-bridge')||src.includes('arlab-v665-install')||src.includes('arlab-v683-installer')||src.includes('arlab-v620-bundle-guard.js')||src.includes('arlab-v671-refresh-memory-guard.js')) s.remove();
  });

  const style=parsed.createElement('style');style.setAttribute('data-arlab-v710','css');style.textContent=css;parsed.head.appendChild(style);

  const cloud=parsed.createElement('script');cloud.setAttribute('data-arlab-cloud','bridge');cloud.textContent=bridge;
  const compat=parsed.createElement('script');compat.textContent='var renderAvailabilityV83, fixMacro, scheduleMacro, fixMacroV143, scheduleMacroV143;';
  const firstScript=parsed.querySelector('script');
  if(firstScript){firstScript.parentNode.insertBefore(cloud,firstScript);firstScript.parentNode.insertBefore(compat,firstScript)}else{parsed.head.appendChild(cloud);parsed.head.appendChild(compat)}

  const diag=parsed.createElement('script');
  diag.textContent="window.addEventListener('error',function(e){console.error('[ARLAB V710 runtime]',e.error||e.message)});window.addEventListener('unhandledrejection',function(e){console.error('[ARLAB V710 promise]',e.reason)});";
  parsed.head.appendChild(diag);

  const patchUrl=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));
  const patch=parsed.createElement('script');patch.src=patchUrl;patch.defer=true;patch.setAttribute('data-arlab-v710','js');parsed.body.appendChild(patch);

  const version=parsed.createElement('script');
  version.textContent="window.ARLAB_CLOUD_RELEASE='V710';window.ARLAB_PLAYER_PORTAL='/arlab-performance-hub/checkin/';";
  parsed.body.appendChild(version);

  msg.textContent='Iniciando ARLAB V710…';
  document.open();document.write('<!doctype html>\n'+parsed.documentElement.outerHTML);document.close();
}catch(e){fail(e)}
})();
</script>
</body>
</html>
